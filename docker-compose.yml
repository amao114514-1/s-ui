---
services:
  s-ui:
    image: ${S_UI_IMAGE:?set S_UI_IMAGE to a pinned image tag}
    container_name: s-ui
    hostname: "s-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/app/cert"
    tty: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:2095:2095"
      - "127.0.0.1:2096:2096"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - s-ui
    entrypoint: "./entrypoint.sh"

networks:
  s-ui:
    driver: bridge
